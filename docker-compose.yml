version: '3.8'

services:
  backend:
    build:
      context: ./backend_python-v2
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGIN=http://localhost:3000
      - DB_PORT=3306
      - DB_HOST=db
      - DB_NAME=edutech_db
      - DB_USER=edutech_user
      - DB_PASSWORD=edutech_password
    depends_on:
      - db
    networks:
      - edutech-network

  frontend:
    build:
      context: ./frontend_angular-v2
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - edutech-network

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      - MYSQL_DATABASE=edutech_db
      - MYSQL_USER=edutech_user
      - MYSQL_PASSWORD=edutech_password
      - MYSQL_ROOT_PASSWORD=root_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - edutech-network

networks:
  edutech-network:
    driver: bridge

volumes:
  mysql_data:
